[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "testtrace-guard"
version = "0.1.0"
description = "Automated RF test fault triage and measurement integrity assurance system."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Muhammad Nuruddin" }
]
dependencies = [
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "streamlit>=1.30.0",
    "httpx>=0.25.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
testtrace = "testtrace.pipeline:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["testtrace*"]

[tool.poetry]
name = "testtrace-guard"
version = "0.1.0"
description = "Automated RF test fault triage and measurement integrity assurance system."
authors = ["Muhammad Nuruddin"]
readme = "README.md"
packages = [{ include = "testtrace" }]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
pydantic = ">=2.0.0"
fastapi = ">=0.100.0"
uvicorn = ">=0.23.0"
streamlit = ">=1.30.0"
httpx = ">=0.25.0"
openai = ">=1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0.0"

[tool.poetry.scripts]
testtrace = "testtrace.pipeline:main"